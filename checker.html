<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>프레임 체커</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="캠스터디">
<link rel="stylesheet" href="shared/theme.css">
<style>
  :root { --page-max-width: 640px; }

  .viewfinder {
    position: relative;
    width: 100%;
    max-width: 640px;
    aspect-ratio: 16 / 9;
    background: var(--stage-frame);
    border-radius: 4px;
    overflow: hidden;
    padding: 14px;
  }
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    background: #000;
    border-radius: 2px;
    overflow: hidden;
  }
  video, canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  #liveCanvas { pointer-events: none; }
  #resultCanvas { display: none; background: #000; }

  .spec {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    text-align: right;
    line-height: 1.5;
  }

  .bracket {
    position: absolute;
    width: 22px;
    height: 22px;
    border: 2px solid rgba(238, 240, 234, 0.85);
    pointer-events: none;
    z-index: 6;
  }
  .bracket.tl { top: 10px; left: 10px; border-right: none; border-bottom: none; }
  .bracket.tr { top: 10px; right: 10px; border-left: none; border-bottom: none; }
  .bracket.bl { bottom: 10px; left: 10px; border-right: none; border-top: none; }
  .bracket.br { bottom: 10px; right: 10px; border-left: none; border-top: none; }

  .hud {
    position: absolute;
    z-index: 6;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.03em;
    color: #eef0ea;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
  }
  .hud-top-left { top: 22px; left: 22px; }
  .hud-top-right {
    top: 22px; right: 22px;
    text-align: right;
  }
  .hud-rec {
    display: inline-flex;
    align-items: center;
    gap: 5px;
  }
  .hud-rec .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--ink-soft);
  }
  .hud-rec.live .dot {
    background: var(--danger);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .hud-rec.live { color: var(--danger); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.35; }
  }
  @media (prefers-reduced-motion: reduce) {
    .hud-rec.live .dot { animation: none; }
  }
  .hud-countdown {
    font-family: var(--mono);
    font-variant-numeric: tabular-nums;
    font-size: 15px;
    font-weight: 600;
  }
  .hud-frame-count {
    position: absolute;
    z-index: 6;
    bottom: 22px;
    left: 22px;
    font-family: var(--mono);
    font-size: 11px;
    color: #eef0ea;
    text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    display: flex;
    gap: 4px;
  }
  .hud-frame-count .tick {
    width: 12px;
    height: 3px;
    background: rgba(238,240,234,0.3);
    border-radius: 1px;
  }
  .hud-frame-count .tick.filled { background: var(--accent); }

  .filmstrip {
    display: flex;
    gap: 6px;
    width: 100%;
    max-width: 640px;
    overflow-x: auto;
    padding: 2px;
  }
  .filmstrip img {
    width: 68px;
    height: 51px;
    object-fit: cover;
    border-radius: 3px;
    border: 1px solid var(--hairline);
    flex-shrink: 0;
  }

  .panel {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .opacity-control {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 6px;
  }
  .opacity-control span {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-soft);
    white-space: nowrap;
  }
  .opacity-control input[type=range] {
    flex: 1;
    accent-color: var(--accent);
  }

  .mode-row {
    display: flex;
    align-items: stretch;
    gap: 18px;
    padding: 16px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 10px;
  }
  .mode-group {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  .mode-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .mode-divider {
    width: 1px;
    background: var(--hairline);
    flex-shrink: 0;
  }

  .controls {
    display: flex;
    align-items: center;
    gap: 14px;
    justify-content: center;
  }

  /* 셔터 버튼: 조리개형 — 링 안에 원형 앰버 코어 */
  .btn-shutter {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: var(--surface);
    border: 3px solid var(--accent);
    flex-shrink: 0;
    padding: 0;
    position: relative;
  }
  .btn-shutter::before {
    content: "";
    position: absolute;
    inset: 6px;
    border-radius: 50%;
    background: var(--accent);
    transition: inset 0.15s, border-radius 0.15s;
  }
  .btn-shutter.recording {
    border-color: var(--danger);
  }
  .btn-shutter.recording::before {
    background: var(--danger);
    inset: 20px;
    border-radius: 4px;
  }

  /* 녹화 버튼: 캠코더형 — 링 안에 REC 점, 누르면 정지 사각형 */
  .btn-rec {
    width: 62px;
    height: 62px;
    border-radius: 50%;
    background: var(--surface);
    border: 3px solid var(--danger);
    flex-shrink: 0;
    padding: 0;
    position: relative;
  }
  .btn-rec::before {
    content: "";
    position: absolute;
    inset: 18px;
    border-radius: 50%;
    background: var(--danger);
    transition: inset 0.15s, border-radius 0.15s;
  }
  .btn-rec.active {
    animation: rec-ring 1.4s ease-in-out infinite;
  }
  .btn-rec.active::before {
    border-radius: 4px;
    inset: 22px;
  }
  @keyframes rec-ring {
    0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--danger) 35%, transparent); }
    50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--danger) 0%, transparent); }
  }
  @media (prefers-reduced-motion: reduce) {
    .btn-rec.active { animation: none; }
  }

  .status {
    font-family: var(--mono);
    font-size: 12px;
    color: var(--ink-soft);
    min-height: 16px;
    text-align: center;
  }
</style>
</head>
<body>

<div id="navSlot" data-active="checker"></div>

<header>
  <div class="brand">
    <span class="eyebrow">Framing Check</span>
    <h1>프레임 체커</h1>
  </div>
  <div class="spec">GRID 4×4<br>6 FRAMES / 30s</div>
</header>

<div class="viewfinder">
  <div class="stage" id="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="liveCanvas"></canvas>
    <canvas id="resultCanvas"></canvas>
    <div class="bracket tl"></div>
    <div class="bracket tr"></div>
    <div class="bracket bl"></div>
    <div class="bracket br"></div>
    <div class="hud hud-top-left" id="hudLabel">
      <span class="hud-rec" id="hudRec"><span class="dot"></span>STANDBY</span>
    </div>
    <div class="hud hud-top-right" id="hudCountdown"></div>
    <div class="hud-frame-count" id="frameTicks"></div>
  </div>
</div>

<div class="filmstrip" id="thumbs"></div>

<div class="panel">
  <div class="opacity-control hidden" id="opacityControl">
    <span>Overlay</span>
    <input type="range" id="opacitySlider" min="0.1" max="0.8" step="0.05" value="0.35">
  </div>

  <div class="mode-row">
    <div class="mode-group">
      <span class="mode-label">Stills · 30s × 6</span>
      <div class="controls">
        <button id="switchBtn" class="btn-icon" title="카메라 전환" aria-label="카메라 전환">⟲</button>
        <button id="startBtn" class="btn-shutter" title="촬영 시작" aria-label="촬영 시작"></button>
        <button id="stopBtn" class="btn-shutter recording hidden" title="중지" aria-label="중지"></button>
        <button id="resetBtn" class="btn-icon hidden" title="다시 촬영" aria-label="다시 촬영">↺</button>
        <button id="downloadBtn" class="btn-icon hidden" title="이미지 저장" aria-label="이미지 저장">⬇</button>
      </div>
    </div>

    <div class="mode-divider" aria-hidden="true"></div>

    <div class="mode-group">
      <span class="mode-label">Video · 1:30</span>
      <div class="controls">
        <button id="recordBtn" class="btn-rec" title="화면 녹화 시작 (1분 30초)" aria-label="화면 녹화 시작"></button>
        <button id="recordStopBtn" class="btn-rec active hidden" title="녹화 중지" aria-label="녹화 중지"></button>
        <button id="videoDownloadBtn" class="btn-icon hidden" title="영상 저장" aria-label="영상 저장">⬇</button>
      </div>
    </div>
  </div>

  <div class="status" id="status">카메라를 시작하려면 브라우저 권한을 허용해주세요.</div>
</div>

<script src="shared/auth.js"></script>
<script src="shared/nav.js"></script>
<script>
(() => {
  const video = document.getElementById('video');
  const liveCanvas = document.getElementById('liveCanvas');
  const resultCanvas = document.getElementById('resultCanvas');
  const stage = document.getElementById('stage');
  const hudRec = document.getElementById('hudRec');
  const hudCountdown = document.getElementById('hudCountdown');
  const frameTicks = document.getElementById('frameTicks');
  const thumbsEl = document.getElementById('thumbs');
  const statusEl = document.getElementById('status');
  const opacityControl = document.getElementById('opacityControl');
  const opacitySlider = document.getElementById('opacitySlider');

  const switchBtn = document.getElementById('switchBtn');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const resetBtn = document.getElementById('resetBtn');
  const downloadBtn = document.getElementById('downloadBtn');
  const recordBtn = document.getElementById('recordBtn');
  const recordStopBtn = document.getElementById('recordStopBtn');
  const videoDownloadBtn = document.getElementById('videoDownloadBtn');

  const liveCtx = liveCanvas.getContext('2d');
  const resultCtx = resultCanvas.getContext('2d');

  const TOTAL_SHOTS = 6;
  const INTERVAL_SEC = 30;

  let currentFacing = 'user'; // 'user' = 전면, 'environment' = 후면
  let stream = null;
  let capturedShots = [];
  let captureTimer = null;
  let countdownTimer = null;
  let remainingSec = 0;
  let shotsLeft = TOTAL_SHOTS;
  let isCapturing = false;

  const RECORD_SEC = 90;
  let mediaRecorder = null;
  let recordedChunks = [];
  let recordedBlobUrl = null;
  let recordCountdownTimer = null;
  let recordRemainingSec = RECORD_SEC;
  let isRecording = false;

  function drawGrid(ctx, w, h) {
    ctx.save();
    ctx.strokeStyle = 'rgba(238,240,234,0.5)';
    ctx.lineWidth = 1;
    for (let i = 1; i < 4; i++) {
      const x = (w / 4) * i;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, h);
      ctx.stroke();
      const y = (h / 4) * i;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(w, y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function resizeCanvases() {
    const rect = stage.getBoundingClientRect();
    const w = Math.round(rect.width);
    const h = Math.round(rect.height);
    [liveCanvas, resultCanvas].forEach(c => {
      c.width = w;
      c.height = h;
    });
  }
  window.addEventListener('resize', resizeCanvases);

  function renderLive() {
    if (video.readyState >= 2) {
      const w = liveCanvas.width, h = liveCanvas.height;
      liveCtx.clearRect(0, 0, w, h);
      // object-fit: cover 방식으로 비디오를 캔버스에 맞춤
      const vw = video.videoWidth, vh = video.videoHeight;
      if (vw && vh) {
        const scale = Math.max(w / vw, h / vh);
        const sw = w / scale, sh = h / scale;
        const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
        liveCtx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
      }
      drawGrid(liveCtx, w, h);
    }
    requestAnimationFrame(renderLive);
  }

  async function startCamera(facing) {
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }
    statusEl.textContent = '카메라 연결 중...';
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: facing,
          width: { ideal: 1280 },
          height: { ideal: 720 }
        },
        audio: false
      });
      video.srcObject = stream;
      await video.play();
      resizeCanvases();
      statusEl.textContent = '준비 완료. 촬영 시작을 누르세요.';
      startBtn.disabled = false;
    } catch (err) {
      console.error(err);
      statusEl.textContent = '카메라 접근 실패: ' + err.message + ' (다른 카메라로 전환해보세요)';
      startBtn.disabled = true;
    }
  }

  switchBtn.addEventListener('click', () => {
    currentFacing = currentFacing === 'user' ? 'environment' : 'user';
    startCamera(currentFacing);
  });

  function captureFrame() {
    const w = liveCanvas.width, h = liveCanvas.height;
    const shotCanvas = document.createElement('canvas');
    shotCanvas.width = w;
    shotCanvas.height = h;
    const sctx = shotCanvas.getContext('2d');
    const vw = video.videoWidth, vh = video.videoHeight;
    const scale = Math.max(w / vw, h / vh);
    const sw = w / scale, sh = h / scale;
    const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
    sctx.drawImage(video, sx, sy, sw, sh, 0, 0, w, h);
    return shotCanvas;
  }

  function addThumb(canvas) {
    const img = document.createElement('img');
    img.src = canvas.toDataURL('image/jpeg', 0.7);
    thumbsEl.appendChild(img);
  }

  function renderOverlayResult() {
    const w = resultCanvas.width, h = resultCanvas.height;
    resultCtx.clearRect(0, 0, w, h);
    resultCtx.fillStyle = '#000';
    resultCtx.fillRect(0, 0, w, h);

    const baseAlpha = parseFloat(opacitySlider.value);
    capturedShots.forEach((shot, idx) => {
      resultCtx.globalAlpha = idx === 0 ? 1 : baseAlpha;
      resultCtx.drawImage(shot, 0, 0, w, h);
    });
    resultCtx.globalAlpha = 1;
    drawGrid(resultCtx, w, h);
  }

  opacitySlider.addEventListener('input', () => {
    if (capturedShots.length > 0 && resultCanvas.style.display === 'block') {
      renderOverlayResult();
    }
  });

  function renderFrameTicks() {
    frameTicks.innerHTML = '';
    for (let i = 0; i < TOTAL_SHOTS; i++) {
      const tick = document.createElement('div');
      tick.className = 'tick' + (i < capturedShots.length ? ' filled' : '');
      frameTicks.appendChild(tick);
    }
  }

  function updateBadge() {
    renderFrameTicks();
    if (isCapturing) {
      const mm = String(Math.floor(remainingSec / 60)).padStart(2, '0');
      const ss = String(remainingSec % 60).padStart(2, '0');
      hudRec.innerHTML = '<span class="dot"></span>REC ' + (TOTAL_SHOTS - shotsLeft) + '/' + TOTAL_SHOTS;
      hudRec.classList.add('live');
      hudCountdown.innerHTML = '<span class="hud-countdown">' + mm + ':' + ss + '</span>NEXT FRAME';
    } else if (!isRecording) {
      hudRec.innerHTML = '<span class="dot"></span>STANDBY';
      hudRec.classList.remove('live');
      hudCountdown.textContent = '';
    } else {
      hudCountdown.textContent = '';
    }
  }

  function stopSequence() {
    isCapturing = false;
    clearInterval(captureTimer);
    clearInterval(countdownTimer);
    captureTimer = null;
    countdownTimer = null;
    updateBadge();
    startBtn.classList.remove('hidden');
    stopBtn.classList.add('hidden');
    switchBtn.disabled = isRecording;
    recordBtn.disabled = false;
  }

  function finishSequence() {
    stopSequence();
    statusEl.textContent = `촬영 완료: 총 ${capturedShots.length}장. 오버레이 결과를 확인하세요.`;
    liveCanvas.style.display = 'none';
    video.style.display = 'none';
    resultCanvas.style.display = 'block';
    opacityControl.classList.remove('hidden');
    resetBtn.classList.remove('hidden');
    downloadBtn.classList.remove('hidden');
    recordBtn.disabled = true;
    renderOverlayResult();
  }

  function startSequence() {
    capturedShots = [];
    thumbsEl.innerHTML = '';
    shotsLeft = TOTAL_SHOTS;
    isCapturing = true;
    remainingSec = INTERVAL_SEC;

    startBtn.classList.add('hidden');
    stopBtn.classList.remove('hidden');
    switchBtn.disabled = true;
    resetBtn.classList.add('hidden');
    downloadBtn.classList.add('hidden');
    recordBtn.disabled = true;

    // 첫 컷은 즉시 촬영
    const first = captureFrame();
    capturedShots.push(first);
    addThumb(first);
    shotsLeft--;
    statusEl.textContent = `1번째 사진 촬영됨. 총 ${TOTAL_SHOTS}장 중 ${TOTAL_SHOTS - shotsLeft}장 완료.`;
    updateBadge();

    countdownTimer = setInterval(() => {
      remainingSec--;
      if (remainingSec < 0) remainingSec = 0;
      updateBadge();
    }, 1000);

    captureTimer = setInterval(() => {
      if (shotsLeft <= 0) {
        finishSequence();
        return;
      }
      const shot = captureFrame();
      capturedShots.push(shot);
      addThumb(shot);
      shotsLeft--;
      statusEl.textContent = `${capturedShots.length}번째 사진 촬영됨. 총 ${TOTAL_SHOTS}장 중 ${capturedShots.length}장 완료.`;
      remainingSec = INTERVAL_SEC;
      updateBadge();
      if (shotsLeft <= 0) {
        clearInterval(captureTimer);
        clearInterval(countdownTimer);
        finishSequence();
      }
    }, INTERVAL_SEC * 1000);
  }

  startBtn.addEventListener('click', startSequence);
  stopBtn.addEventListener('click', () => {
    stopSequence();
    statusEl.textContent = '촬영이 중지되었습니다.';
  });

  resetBtn.addEventListener('click', () => {
    capturedShots = [];
    thumbsEl.innerHTML = '';
    resultCanvas.style.display = 'none';
    liveCanvas.style.display = 'block';
    video.style.display = 'block';
    opacityControl.classList.add('hidden');
    resetBtn.classList.add('hidden');
    downloadBtn.classList.add('hidden');
    recordBtn.disabled = false;
    statusEl.textContent = '준비 완료. 촬영 시작을 누르세요.';
    updateBadge();
  });

  downloadBtn.addEventListener('click', () => {
    const link = document.createElement('a');
    const ts = new Date().toISOString().replace(/[:.]/g, '-');
    link.download = `fov-check-${ts}.jpg`;
    link.href = resultCanvas.toDataURL('image/jpeg', 0.92);
    link.click();
  });

  function pickRecorderMimeType() {
    const candidates = [
      'video/webm;codecs=vp9',
      'video/webm;codecs=vp8',
      'video/webm'
    ];
    return candidates.find(type => window.MediaRecorder && MediaRecorder.isTypeSupported(type)) || '';
  }

  function updateRecordHud() {
    if (isRecording) {
      const mm = String(Math.floor(recordRemainingSec / 60)).padStart(2, '0');
      const ss = String(recordRemainingSec % 60).padStart(2, '0');
      hudRec.innerHTML = '<span class="dot"></span>REC ' + mm + ':' + ss;
      hudRec.classList.add('live');
    } else if (!isCapturing) {
      hudRec.innerHTML = '<span class="dot"></span>STANDBY';
      hudRec.classList.remove('live');
    }
  }

  function startRecording() {
    if (!liveCanvas.captureStream) {
      statusEl.textContent = '이 브라우저는 화면 녹화를 지원하지 않습니다.';
      return;
    }
    if (recordedBlobUrl) {
      URL.revokeObjectURL(recordedBlobUrl);
      recordedBlobUrl = null;
    }
    recordedChunks = [];
    const canvasStream = liveCanvas.captureStream(30);
    const mimeType = pickRecorderMimeType();
    try {
      mediaRecorder = new MediaRecorder(canvasStream, mimeType ? { mimeType } : undefined);
    } catch (err) {
      console.error(err);
      statusEl.textContent = '녹화를 시작할 수 없습니다: ' + err.message;
      return;
    }

    mediaRecorder.ondataavailable = (e) => {
      if (e.data && e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = () => {
      const blob = new Blob(recordedChunks, { type: mimeType || 'video/webm' });
      recordedBlobUrl = URL.createObjectURL(blob);
      videoDownloadBtn.classList.remove('hidden');
      statusEl.textContent = `녹화 완료 (${RECORD_SEC}초). 영상을 저장하세요.`;
    };

    mediaRecorder.start();
    isRecording = true;
    recordRemainingSec = RECORD_SEC;
    recordBtn.classList.add('hidden');
    recordStopBtn.classList.remove('hidden');
    videoDownloadBtn.classList.add('hidden');
    switchBtn.disabled = true;
    startBtn.disabled = true;
    statusEl.textContent = `화면 녹화 중... (${RECORD_SEC}초)`;
    updateRecordHud();

    recordCountdownTimer = setInterval(() => {
      recordRemainingSec--;
      updateRecordHud();
      if (recordRemainingSec <= 0) {
        stopRecording();
      }
    }, 1000);
  }

  function stopRecording() {
    if (!isRecording) return;
    isRecording = false;
    clearInterval(recordCountdownTimer);
    recordCountdownTimer = null;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
      mediaRecorder.stop();
    }
    recordBtn.classList.remove('hidden');
    recordStopBtn.classList.add('hidden');
    switchBtn.disabled = isCapturing;
    startBtn.disabled = false;
    updateRecordHud();
  }

  recordBtn.addEventListener('click', startRecording);
  recordStopBtn.addEventListener('click', stopRecording);
  videoDownloadBtn.addEventListener('click', () => {
    if (!recordedBlobUrl) return;
    const link = document.createElement('a');
    const ts = new Date().toISOString().replace(/[:.]/g, '-');
    link.download = `fov-check-recording-${ts}.webm`;
    link.href = recordedBlobUrl;
    link.click();
  });

  // 초기화
  resizeCanvases();
  renderLive();
  updateBadge();
  startCamera(currentFacing);
})();
</script>
</body>
</html>
