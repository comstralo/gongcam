<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>설정</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="캠스터디">
<link rel="stylesheet" href="shared/theme.css">
<style>
  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .settings-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px;
    background: var(--bg);
    border: 1px solid var(--hairline);
    border-radius: 8px;
  }
  .settings-row .row-body {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }
  .settings-row .row-title {
    font-size: 14px;
    font-weight: 600;
  }
  .settings-row .row-desc {
    font-size: 12px;
    color: var(--ink-soft);
  }
  .settings-row .row-chip {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div id="navSlot" data-active="settings"></div>

<header>
  <div class="brand">
    <span class="eyebrow">Framing Check</span>
    <h1>설정</h1>
  </div>
</header>

<div class="card hidden" id="settingsCard">
  <div class="session-row">
    <div class="who">
      <span class="name" id="sessionName"></span>
      <span class="email" id="sessionEmail"></span>
    </div>
    <button class="logout-link" id="logoutBtn">로그아웃</button>
  </div>

  <span class="section-label">알림</span>
  <div class="settings-row">
    <div class="row-body">
      <span class="row-title">브라우저 푸시 알림</span>
      <span class="row-desc">제보/벌금 알림 등 종류별 on/off는 곧 추가됩니다</span>
    </div>
    <span class="row-chip">준비 중</span>
  </div>
</div>

<script src="shared/auth.js"></script>
<script src="shared/nav.js"></script>
<script>
(() => {
  const settingsCard = document.getElementById('settingsCard');

  Auth.requireSession((session) => {
    settingsCard.classList.remove('hidden');
    Auth.bindSessionUI(session);
  });
})();
</script>
</body>
</html>
