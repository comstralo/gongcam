<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>관리자</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="캠스터디">
<link rel="stylesheet" href="shared/theme.css">
<style>
  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .push-status {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    font-size: 13px;
  }
  .push-status .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--ink-soft);
    flex-shrink: 0;
  }
  .push-status.on .dot { background: var(--ok); }
  .push-status.off .dot { background: var(--danger); }

  .denied-copy {
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-soft);
    text-align: center;
  }
</style>
</head>
<body>

<div id="navSlot" data-active="admin"></div>

<header>
  <div class="brand">
    <span class="eyebrow">Framing Check</span>
    <h1>관리자</h1>
  </div>
</header>

<div class="card hidden" id="deniedCard">
  <p class="denied-copy">관리자 계정으로 로그인해야 접근할 수 있습니다.</p>
</div>

<div class="card hidden" id="adminCard">
  <div class="session-row">
    <div class="who">
      <span class="name" id="sessionName"></span>
      <span class="email" id="sessionEmail"></span>
    </div>
    <button class="logout-link" id="logoutBtn">로그아웃</button>
  </div>

  <span class="section-label">브라우저 푸시 알림</span>
  <div class="push-status" id="pushStatus">
    <span class="dot"></span>
    <span id="pushStatusText">알림 상태 확인 중...</span>
  </div>

  <button class="btn primary" id="enablePushBtn">알림 켜기</button>
  <button class="btn hidden" id="sendTestBtn">테스트 알림 보내기</button>

  <div class="msg" id="pushMsg"></div>
</div>

<script src="shared/auth.js"></script>
<script src="shared/nav.js"></script>
<script>
(() => {
  const VAPID_PUBLIC_KEY = 'BNilzFCLuM4JxoD9riCTTP84Rv-xT7ohuNs4l-ZzC9LiNDxQOwhLkHX0qb5ljFAs1pvfMOplTe0Bf0SQ1IZUU04';

  const deniedCard = document.getElementById('deniedCard');
  const adminCard = document.getElementById('adminCard');
  const pushStatus = document.getElementById('pushStatus');
  const pushStatusText = document.getElementById('pushStatusText');
  const enablePushBtn = document.getElementById('enablePushBtn');
  const sendTestBtn = document.getElementById('sendTestBtn');
  const pushMsg = document.getElementById('pushMsg');

  function urlBase64ToUint8Array(base64String) {
    const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
    const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    const rawData = atob(base64);
    const outputArray = new Uint8Array(rawData.length);
    for (let i = 0; i < rawData.length; i++) {
      outputArray[i] = rawData.charCodeAt(i);
    }
    return outputArray;
  }

  function updatePushStatus(state) {
    pushStatus.className = 'push-status ' + state;
    if (state === 'on') {
      pushStatusText.textContent = '알림 켜짐 · 이 브라우저는 구독 중';
      enablePushBtn.classList.add('hidden');
      sendTestBtn.classList.remove('hidden');
    } else if (state === 'off') {
      pushStatusText.textContent = '알림 꺼짐 · 아직 구독하지 않음';
      enablePushBtn.classList.remove('hidden');
      sendTestBtn.classList.add('hidden');
    } else {
      pushStatusText.textContent = '이 브라우저는 푸시 알림을 지원하지 않습니다.';
      enablePushBtn.classList.add('hidden');
      sendTestBtn.classList.add('hidden');
    }
  }

  function swUrl() {
    return new URL('sw.js', document.baseURI).href;
  }

  async function checkPushState() {
    if (!('serviceWorker' in navigator) || !('PushManager' in window)) {
      updatePushStatus('unsupported');
      Auth.setMsg(pushMsg, '이 브라우저/모드는 serviceWorker 또는 PushManager를 지원하지 않습니다. (standalone: ' + (window.navigator.standalone ?? 'n/a') + ')', 'error');
      return;
    }
    try {
      const reg = await navigator.serviceWorker.register(swUrl());
      await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.getSubscription();
      updatePushStatus(sub ? 'on' : 'off');
    } catch (err) {
      updatePushStatus('unsupported');
      Auth.setMsg(pushMsg, 'Service Worker 등록 실패: ' + err.name + ' — ' + err.message, 'error');
    }
  }

  async function enablePush(session) {
    Auth.setMsg(pushMsg, '알림 권한 요청 중...', '');
    try {
      const permission = await Notification.requestPermission();
      if (permission !== 'granted') {
        Auth.setMsg(pushMsg, '브라우저 알림 권한이 거부되었습니다. (현재 상태: ' + permission + ')', 'error');
        return;
      }
      const reg = await navigator.serviceWorker.register(swUrl());
      await navigator.serviceWorker.ready;
      const sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY),
      });

      const res = await fetch(Auth.WORKER_BASE + '/push/subscribe', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + session.token,
        },
        body: JSON.stringify({ subscription: sub.toJSON() }),
      });
      const data = await res.json();
      if (!res.ok) {
        Auth.setMsg(pushMsg, data.error || '구독 등록에 실패했습니다.', 'error');
        return;
      }
      Auth.setMsg(pushMsg, '알림이 켜졌습니다.', 'ok');
      updatePushStatus('on');
    } catch (err) {
      Auth.setMsg(pushMsg, '오류: ' + err.name + ' — ' + err.message, 'error');
    }
  }

  async function sendTest(session) {
    sendTestBtn.disabled = true;
    Auth.setMsg(pushMsg, '테스트 알림 전송 중...', '');
    try {
      const res = await fetch(Auth.WORKER_BASE + '/push/send-test', {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + session.token },
      });
      const data = await res.json();
      if (!res.ok) {
        Auth.setMsg(pushMsg, data.error || '전송에 실패했습니다.', 'error');
        return;
      }
      const detail = (data.results || [])
        .map((r) => (r.error ? `오류: ${r.error}` : `상태 ${r.status}`))
        .join(' / ');
      Auth.setMsg(pushMsg, '전송 완료 — ' + detail, 'ok');
    } catch (err) {
      Auth.setMsg(pushMsg, '오류: ' + err.message, 'error');
    } finally {
      sendTestBtn.disabled = false;
    }
  }

  Auth.requireSession((session) => {
    if (!Auth.isAdmin(session)) {
      deniedCard.classList.remove('hidden');
      return;
    }
    adminCard.classList.remove('hidden');
    Auth.bindSessionUI(session);
    checkPushState();

    enablePushBtn.addEventListener('click', () => enablePush(session));
    sendTestBtn.addEventListener('click', () => sendTest(session));
  });
})();
</script>
</body>
</html>
