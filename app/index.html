<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공부합시당 캠스터디</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="theme-color" content="#ff5a36" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="캠스터디" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css" />
    <script>
      // React가 마운트되기 전에 저장된 테마를 먼저 적용해, 다크모드
      // 사용자가 페이지를 열 때 라이트 화면이 잠깐 번쩍이는(FOUC) 현상을
      // 막는다. useTheme 훅과 반드시 같은 localStorage 키/값, 같은
      // theme-color를 써야 한다.
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#1c1917");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
