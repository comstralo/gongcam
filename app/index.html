<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>공부합시당 캠스터디</title>
    <link rel="manifest" href="manifest.json" />
    <link rel="icon" type="image/png" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <meta name="theme-color" content="#ff5a36" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="캠스터디" />
    <!-- 🔧 [사용자 지시] variable font(pretendardvariable-dynamic-subset,
         format('woff2-variations'))가 플랫폼마다(맥 Chromium vs iOS
         Safari) 같은 font-weight 값을 다른 굵기로 보간해 굵기 차이가
         심하게 느껴졌다("완전히 다른 폰트 같다") — woff2-variations는
         브라우저 엔진별 variable font 처리 방식 차이를 그대로 노출한다.
         고정 weight별 정적 폰트 파일(format('woff2'))로 바꿔 모든
         플랫폼에서 동일한 굵기로 렌더링되게 한다. -->
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-subset.css" />
    <script>
      // React가 마운트되기 전에 저장된 테마를 먼저 적용해, 다크모드
      // 사용자가 페이지를 열 때 라이트 화면이 잠깐 번쩍이는(FOUC) 현상을
      // 막는다. useTheme 훅과 반드시 같은 localStorage 키/값, 같은
      // theme-color를 써야 한다.
      try {
        if (localStorage.getItem("theme") === "dark") {
          document.documentElement.classList.add("dark");
          document.querySelector('meta[name="theme-color"]').setAttribute("content", "#1c1917");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
