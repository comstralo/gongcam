<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>대시보드</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="캠스터디">
<link rel="stylesheet" href="shared/theme.css">
<style>
  .summary-row {
    display: flex;
    gap: 10px;
  }
  .summary-tile {
    flex: 1;
    padding: 14px;
    background: var(--bg);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .summary-tile .label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .summary-tile .value {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .summary-tile .value.fine { color: var(--danger); }
  .summary-tile .value.zero { color: var(--ok); }

  .day-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .day-row {
    display: flex;
    gap: 10px;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    align-items: flex-start;
  }
  .day-row .day-badge {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    width: 24px;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .day-row.today { border-color: var(--accent); }
  .day-row .day-body {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1;
    min-width: 0;
  }
  .day-row .day-amount {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .day-row .day-amount.fine { color: var(--danger); }
  .day-row .day-amount.zero { color: var(--ok); }
  .day-row .day-explain {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .day-row .day-tag {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
  }
</style>
</head>
<body>

<div id="navSlot" data-active="home"></div>

<header>
  <div class="brand">
    <span class="eyebrow">Framing Check</span>
    <h1>대시보드</h1>
  </div>
</header>

<div class="card hidden" id="statusCard">
  <div class="session-row">
    <div class="who">
      <span class="name" id="sessionName"></span>
      <span class="email" id="sessionEmail"></span>
    </div>
    <button class="logout-link" id="logoutBtn">로그아웃</button>
  </div>

  <div class="summary-row">
    <div class="summary-tile">
      <span class="label">목표 유형</span>
      <span class="value" id="goalTypeValue" style="font-size:15px;">-</span>
    </div>
    <div class="summary-tile">
      <span class="label">이번 주 확정 벌금</span>
      <span class="value fine" id="weekTotalValue">₩0</span>
    </div>
  </div>

  <div class="day-list" id="dayList"></div>

  <div class="msg" id="statusMsg"></div>
</div>

<script src="shared/auth.js"></script>
<script src="shared/nav.js"></script>
<script>
(() => {
  const TODAY_INDEX = (new Date().getDay() + 6) % 7; // 월=0 ... 일=6

  const statusCard = document.getElementById('statusCard');
  const goalTypeValue = document.getElementById('goalTypeValue');
  const weekTotalValue = document.getElementById('weekTotalValue');
  const dayList = document.getElementById('dayList');
  const statusMsg = document.getElementById('statusMsg');

  function won(n) {
    return '₩' + (n || 0).toLocaleString();
  }

  function renderStatus(data) {
    goalTypeValue.textContent = data.goalType || '-';
    weekTotalValue.textContent = won(data.weekTotalConfirmed);
    weekTotalValue.classList.toggle('zero', data.weekTotalConfirmed === 0);

    dayList.innerHTML = '';
    data.days.forEach((d, i) => {
      const row = document.createElement('div');
      row.className = 'day-row' + (i === TODAY_INDEX ? ' today' : '');

      const badge = document.createElement('div');
      badge.className = 'day-badge';
      badge.textContent = d.day;
      row.appendChild(badge);

      const body = document.createElement('div');
      body.className = 'day-body';

      const amount = document.createElement('div');
      amount.className = 'day-amount' + (d.total > 0 ? ' fine' : ' zero');
      amount.textContent = won(d.total);
      body.appendChild(amount);

      const explain = document.createElement('div');
      explain.className = 'day-explain';
      explain.textContent = d.explain;
      body.appendChild(explain);

      const tag = document.createElement('div');
      tag.className = 'day-tag';
      tag.textContent = d.confirmed ? '확정' : '진행중';
      body.appendChild(tag);

      row.appendChild(body);
      dayList.appendChild(row);
    });
  }

  async function loadStatus(session) {
    Auth.setMsg(statusMsg, '불러오는 중...', '');
    try {
      const res = await fetch(Auth.WORKER_BASE + '/status', {
        headers: { Authorization: 'Bearer ' + session.token },
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 401) {
          Auth.clearSession();
          Auth.redirectToLogin();
        }
        Auth.setMsg(statusMsg, data.error || '상태를 불러오지 못했습니다.', 'error');
        return;
      }
      Auth.setMsg(statusMsg, '', '');
      renderStatus(data);
    } catch (err) {
      Auth.setMsg(statusMsg, '네트워크 오류: ' + err.message, 'error');
    }
  }

  Auth.requireSession((session) => {
    statusCard.classList.remove('hidden');
    Auth.bindSessionUI(session);
    loadStatus(session);
  });
})();
</script>
</body>
</html>
