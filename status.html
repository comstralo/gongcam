<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>내 상태</title>
<style>
  :root {
    --bg: #eef0ec;
    --surface: #ffffff;
    --stage-frame: #1b1d19;
    --ink: #1b1d19;
    --ink-soft: #5c6058;
    --hairline: #d3d6cd;
    --accent: #c8781f;
    --accent-ink: #2a1600;
    --danger: #b3341f;
    --ok: #4a7c3c;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121310;
      --surface: #1a1c17;
      --stage-frame: #0c0d0a;
      --ink: #eef0ea;
      --ink-soft: #9a9d92;
      --hairline: #33362e;
      --accent: #e0a24a;
      --accent-ink: #201200;
      --danger: #e0685a;
      --ok: #7cb36a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121310;
    --surface: #1a1c17;
    --stage-frame: #0c0d0a;
    --ink: #eef0ea;
    --ink-soft: #9a9d92;
    --hairline: #33362e;
    --accent: #e0a24a;
    --accent-ink: #201200;
    --danger: #e0685a;
    --ok: #7cb36a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 32px;
    gap: 18px;
  }

  .sitenav {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 10px;
  }
  .sitenav a {
    flex: 1 1 0;
    text-align: center;
    padding: 9px 12px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    color: var(--ink-soft);
    transition: background 0.15s, color 0.15s;
  }
  .sitenav a.active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  header {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .gate-copy {
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-soft);
  }
  .gate-copy strong { color: var(--ink); }

  #googleBtnSlot {
    display: flex;
    justify-content: center;
    min-height: 44px;
  }

  .session-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    font-size: 13px;
  }
  .session-row .who {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }
  .session-row .who .name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .session-row .who .email {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .logout-link {
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px;
    flex-shrink: 0;
  }

  .msg {
    font-family: var(--mono);
    font-size: 12px;
    min-height: 16px;
    text-align: center;
  }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--accent); }

  .summary-row {
    display: flex;
    gap: 10px;
  }
  .summary-tile {
    flex: 1;
    padding: 14px;
    background: var(--bg);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .summary-tile .label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }
  .summary-tile .value {
    font-family: var(--mono);
    font-size: 22px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .summary-tile .value.fine { color: var(--danger); }
  .summary-tile .value.zero { color: var(--ok); }

  .day-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .day-row {
    display: flex;
    gap: 10px;
    padding: 12px 14px;
    background: var(--bg);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    align-items: flex-start;
  }
  .day-row .day-badge {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    width: 24px;
    flex-shrink: 0;
    padding-top: 1px;
  }
  .day-row.today { border-color: var(--accent); }
  .day-row .day-body {
    display: flex;
    flex-direction: column;
    gap: 3px;
    flex: 1;
    min-width: 0;
  }
  .day-row .day-amount {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }
  .day-row .day-amount.fine { color: var(--danger); }
  .day-row .day-amount.zero { color: var(--ok); }
  .day-row .day-explain {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.5;
  }
  .day-row .day-tag {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.04em;
    color: var(--ink-soft);
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<nav class="sitenav">
  <a href="index.html">홈</a>
  <a href="checker.html">프레임 체커</a>
  <a href="report.html">제보하기</a>
  <a href="status.html" class="active">내 상태</a>
</nav>

<header>
  <div class="brand">
    <span class="eyebrow">Framing Check</span>
    <h1>내 상태</h1>
  </div>
</header>

<div class="card" id="gateCard">
  <p class="gate-copy">
    Google 계정으로 로그인하면 <strong>본인의 벌금 현황만</strong> 확인할 수 있습니다.<br>
    다른 참여자의 정보는 표시되지 않습니다.
  </p>
  <div id="googleBtnSlot"></div>
  <div class="msg" id="gateMsg"></div>
</div>

<div class="card hidden" id="statusCard">
  <div class="session-row">
    <div class="who">
      <span class="name" id="sessionName"></span>
      <span class="email" id="sessionEmail"></span>
    </div>
    <button class="logout-link" id="logoutBtn">로그아웃</button>
  </div>

  <div class="summary-row">
    <div class="summary-tile">
      <span class="label">목표 유형</span>
      <span class="value" id="goalTypeValue" style="font-size:15px;">-</span>
    </div>
    <div class="summary-tile">
      <span class="label">이번 주 확정 벌금</span>
      <span class="value fine" id="weekTotalValue">₩0</span>
    </div>
  </div>

  <div class="day-list" id="dayList"></div>

  <div class="msg" id="statusMsg"></div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(() => {
  const WORKER_BASE = 'https://frame-checker-worker.comstralo.workers.dev';
  const GOOGLE_CLIENT_ID = '280658144716-4vvnjn23skcshm9t65fibnt0dcuvs3va.apps.googleusercontent.com';
  const SESSION_KEY = 'frameCheckerSession';
  const TODAY_INDEX = (new Date().getDay() + 6) % 7; // 월=0 ... 일=6

  const gateCard = document.getElementById('gateCard');
  const statusCard = document.getElementById('statusCard');
  const googleBtnSlot = document.getElementById('googleBtnSlot');
  const gateMsg = document.getElementById('gateMsg');
  const sessionName = document.getElementById('sessionName');
  const sessionEmail = document.getElementById('sessionEmail');
  const logoutBtn = document.getElementById('logoutBtn');
  const goalTypeValue = document.getElementById('goalTypeValue');
  const weekTotalValue = document.getElementById('weekTotalValue');
  const dayList = document.getElementById('dayList');
  const statusMsg = document.getElementById('statusMsg');

  function setMsg(el, text, type) {
    el.textContent = text || '';
    el.className = 'msg' + (type ? ' ' + type : '');
  }

  function getSession() {
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed.token || !parsed.email) return null;
      return parsed;
    } catch {
      return null;
    }
  }

  function saveSession(session) {
    localStorage.setItem(SESSION_KEY, JSON.stringify(session));
  }

  function clearSession() {
    localStorage.removeItem(SESSION_KEY);
  }

  function showStatus(session) {
    gateCard.classList.add('hidden');
    statusCard.classList.remove('hidden');
    sessionName.textContent = session.name || session.email;
    sessionEmail.textContent = session.email;
    loadStatus();
  }

  function showGate() {
    gateCard.classList.remove('hidden');
    statusCard.classList.add('hidden');
  }

  function won(n) {
    return '₩' + (n || 0).toLocaleString();
  }

  function renderStatus(data) {
    goalTypeValue.textContent = data.goalType || '-';
    weekTotalValue.textContent = won(data.weekTotalConfirmed);
    weekTotalValue.classList.toggle('zero', data.weekTotalConfirmed === 0);

    dayList.innerHTML = '';
    data.days.forEach((d, i) => {
      const row = document.createElement('div');
      row.className = 'day-row' + (i === TODAY_INDEX ? ' today' : '');

      const badge = document.createElement('div');
      badge.className = 'day-badge';
      badge.textContent = d.day;
      row.appendChild(badge);

      const body = document.createElement('div');
      body.className = 'day-body';

      const amount = document.createElement('div');
      amount.className = 'day-amount' + (d.total > 0 ? ' fine' : ' zero');
      amount.textContent = won(d.total);
      body.appendChild(amount);

      const explain = document.createElement('div');
      explain.className = 'day-explain';
      explain.textContent = d.explain;
      body.appendChild(explain);

      const tag = document.createElement('div');
      tag.className = 'day-tag';
      tag.textContent = d.confirmed ? '확정' : '진행중';
      body.appendChild(tag);

      row.appendChild(body);
      dayList.appendChild(row);
    });
  }

  async function loadStatus() {
    const session = getSession();
    if (!session) {
      showGate();
      return;
    }
    setMsg(statusMsg, '불러오는 중...', '');
    try {
      const res = await fetch(WORKER_BASE + '/status', {
        headers: { Authorization: 'Bearer ' + session.token },
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 401) {
          clearSession();
          showGate();
        }
        setMsg(statusMsg, data.error || '상태를 불러오지 못했습니다.', 'error');
        return;
      }
      setMsg(statusMsg, '', '');
      renderStatus(data);
    } catch (err) {
      setMsg(statusMsg, '네트워크 오류: ' + err.message, 'error');
    }
  }

  async function handleCredentialResponse(response) {
    setMsg(gateMsg, '확인 중...', '');
    try {
      const res = await fetch(WORKER_BASE + '/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential }),
      });
      const data = await res.json();
      if (!res.ok) {
        setMsg(gateMsg, data.error || '로그인에 실패했습니다.', 'error');
        return;
      }
      saveSession(data);
      setMsg(gateMsg, '', '');
      showStatus(data);
    } catch (err) {
      setMsg(gateMsg, '네트워크 오류: ' + err.message, 'error');
    }
  }

  window.addEventListener('load', () => {
    const existing = getSession();
    if (existing) {
      showStatus(existing);
      return;
    }
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
      });
      google.accounts.id.renderButton(googleBtnSlot, {
        type: 'standard',
        theme: 'outline',
        size: 'large',
        text: 'signin_with',
        shape: 'pill',
      });
    } else {
      setMsg(gateMsg, 'Google 로그인 스크립트를 불러오지 못했습니다. 새로고침해보세요.', 'error');
    }
  });

  logoutBtn.addEventListener('click', () => {
    clearSession();
    showGate();
    window.location.reload();
  });
})();
</script>
</body>
</html>
