<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>화각 제보</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="캠스터디">
<link rel="stylesheet" href="shared/theme.css">
<style>
  label {
    display: flex;
    flex-direction: column;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
  }
  label .hint {
    font-weight: 400;
    font-size: 11px;
    color: var(--ink-soft);
  }
  input[type=text], textarea, select {
    font-family: var(--sans);
    font-size: 15px;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--hairline);
    background: var(--bg);
    color: var(--ink);
  }
  input[type=text]:focus, textarea:focus, select:focus {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  select:disabled {
    opacity: 0.5;
  }
  .roster-refresh {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .roster-refresh select { flex: 1; }
  .roster-refresh button {
    width: 40px;
    height: 40px;
    flex-shrink: 0;
    border-radius: 8px;
    font-size: 15px;
  }
  textarea {
    resize: vertical;
    min-height: 72px;
    font-family: var(--sans);
  }

  #submitBtn { width: 100%; }
</style>
</head>
<body>

<div id="navSlot" data-active="report"></div>

<header>
  <div class="brand">
    <span class="eyebrow">Framing Check</span>
    <h1>화각 제보</h1>
  </div>
</header>

<div class="card hidden" id="formCard">
  <div class="session-row">
    <div class="who">
      <span class="name" id="sessionName"></span>
      <span class="email" id="sessionEmail"></span>
    </div>
    <button class="logout-link" id="logoutBtn">로그아웃</button>
  </div>

  <label>
    대상 참여자
    <span class="hint" id="rosterHint">실시간 접속 명단을 불러오는 중...</span>
    <div class="roster-refresh">
      <select id="nicknameSelect">
        <option value="">명단을 불러오는 중...</option>
      </select>
      <button type="button" id="rosterRefreshBtn" title="명단 새로고침" aria-label="명단 새로고침">⟲</button>
    </div>
  </label>

  <label>
    상황 설명 (선택)
    <span class="hint">화각 이탈, 화면 정지 등 간단히 적어주세요</span>
    <textarea id="reasonInput" placeholder="예: 손이 안 보여요" maxlength="200"></textarea>
  </label>

  <button class="btn primary" id="submitBtn">제보 접수</button>
  <div class="msg" id="formMsg"></div>
</div>

<script src="shared/auth.js"></script>
<script src="shared/nav.js"></script>
<script>
(() => {
  const formCard = document.getElementById('formCard');
  const nicknameSelect = document.getElementById('nicknameSelect');
  const rosterHint = document.getElementById('rosterHint');
  const rosterRefreshBtn = document.getElementById('rosterRefreshBtn');
  const reasonInput = document.getElementById('reasonInput');
  const submitBtn = document.getElementById('submitBtn');
  const formMsg = document.getElementById('formMsg');

  const ROSTER_POLL_MS = 15000;
  let rosterPollTimer = null;

  function renderRoster(members, stale) {
    const prevValue = nicknameSelect.value;
    nicknameSelect.innerHTML = '';

    if (!members || members.length === 0) {
      const opt = document.createElement('option');
      opt.value = '';
      opt.textContent = '현재 접속 중인 참여자가 없습니다';
      nicknameSelect.appendChild(opt);
      nicknameSelect.disabled = true;
      submitBtn.disabled = true;
    } else {
      const placeholder = document.createElement('option');
      placeholder.value = '';
      placeholder.textContent = '참여자를 선택하세요';
      nicknameSelect.appendChild(placeholder);
      members.forEach((name) => {
        const opt = document.createElement('option');
        opt.value = name;
        opt.textContent = name;
        nicknameSelect.appendChild(opt);
      });
      nicknameSelect.disabled = false;
      submitBtn.disabled = false;
      if (members.includes(prevValue)) nicknameSelect.value = prevValue;
    }

    rosterHint.textContent = stale
      ? '명단이 최신이 아닐 수 있습니다 (봇 연결 확인 중) · ⟲로 다시 시도'
      : '실시간 구루미 접속 명단입니다';
  }

  async function loadRoster(session) {
    try {
      const res = await fetch(Auth.WORKER_BASE + '/participants', {
        headers: { Authorization: 'Bearer ' + session.token },
      });
      const data = await res.json();
      if (!res.ok) {
        if (res.status === 401) {
          stopRosterPolling();
          Auth.clearSession();
          Auth.redirectToLogin();
        }
        rosterHint.textContent = data.error || '명단을 불러오지 못했습니다.';
        return;
      }
      renderRoster(data.members, data.stale);
    } catch (err) {
      rosterHint.textContent = '명단 조회 실패: ' + err.message;
    }
  }

  function startRosterPolling(session) {
    loadRoster(session);
    stopRosterPolling();
    rosterPollTimer = setInterval(() => loadRoster(session), ROSTER_POLL_MS);
  }

  function stopRosterPolling() {
    if (rosterPollTimer) {
      clearInterval(rosterPollTimer);
      rosterPollTimer = null;
    }
  }

  const session = Auth.requireSession((session) => {
    formCard.classList.remove('hidden');
    Auth.bindSessionUI(session, stopRosterPolling);
    rosterRefreshBtn.addEventListener('click', () => loadRoster(session));
    startRosterPolling(session);

    submitBtn.addEventListener('click', async () => {
      const nickname = nicknameSelect.value;
      if (!nickname) {
        Auth.setMsg(formMsg, '대상 참여자를 선택해주세요.', 'error');
        nicknameSelect.focus();
        return;
      }

      submitBtn.disabled = true;
      Auth.setMsg(formMsg, '제보 접수 중...', '');
      try {
        const res = await fetch(Auth.WORKER_BASE + '/report', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            token: session.token,
            nickname,
            reason: reasonInput.value.trim(),
          }),
        });
        const data = await res.json();
        if (!res.ok) {
          if (res.status === 401) {
            Auth.clearSession();
            Auth.redirectToLogin();
          }
          Auth.setMsg(formMsg, data.error || '제보 접수에 실패했습니다.', 'error');
          return;
        }
        Auth.setMsg(formMsg, '제보가 접수되었습니다. 잠시 후 확인됩니다.', 'ok');
        nicknameSelect.value = '';
        reasonInput.value = '';
      } catch (err) {
        Auth.setMsg(formMsg, '네트워크 오류: ' + err.message, 'error');
      } finally {
        submitBtn.disabled = false;
      }
    });
  });

  if (session) {
    window.addEventListener('beforeunload', stopRosterPolling);
  }
})();
</script>
</body>
</html>
