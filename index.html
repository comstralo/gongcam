<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공부합시당 캠스터디</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="캠스터디">
<link rel="stylesheet" href="shared/theme.css">
<style>
  .gate-copy {
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-soft);
  }
  .gate-copy strong { color: var(--ink); }

  .session-mode {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .session-mode-option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--hairline);
    background: var(--bg);
    cursor: pointer;
  }
  .session-mode-option:has(input:checked) {
    border-color: var(--accent);
  }
  .session-mode-option input {
    margin-top: 3px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  .session-mode-option .option-body {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .session-mode-option .option-title {
    font-size: 13px;
    font-weight: 600;
  }
  .session-mode-option .option-desc {
    font-size: 11px;
    color: var(--ink-soft);
  }

  #googleBtnSlot {
    display: flex;
    justify-content: center;
    min-height: 44px;
  }

  .launch-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .launch-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid var(--hairline);
    background: var(--bg);
    color: var(--ink);
    text-decoration: none;
    transition: border-color 0.15s, transform 0.1s;
  }
  .launch-btn:active { transform: scale(0.98); }
  .launch-btn .icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .launch-btn .body {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-width: 0;
  }
  .launch-btn .title {
    font-weight: 700;
    font-size: 15px;
  }
  .launch-btn .desc {
    font-size: 12px;
    color: var(--ink-soft);
  }
  .launch-btn .chip {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .launch-btn.always-open {
    border-color: var(--accent);
  }
  .launch-btn.always-open .chip {
    color: var(--accent);
  }
</style>
</head>
<body>

<div id="navSlot" data-active="home"></div>

<header>
  <div class="brand">
    <span class="eyebrow">Framing Check</span>
    <h1>공부합시당 캠스터디</h1>
  </div>
</header>

<div class="card">
  <a class="launch-btn always-open" href="checker.html">
    <span class="icon">📐</span>
    <span class="body">
      <span class="title">프레임 체커</span>
      <span class="desc">4×4 격자로 화각을 점검하고 사진/영상을 촬영합니다</span>
    </span>
    <span class="chip">누구나</span>
  </a>
</div>

<div class="card" id="gateCard">
  <p class="gate-copy">
    아래 기능은 <strong>참여자 명단(스프레드시트 열람 권한)</strong>에 등록된 계정만 이용할 수 있습니다.<br>
    Google 계정으로 로그인하면 자동으로 확인됩니다.
  </p>
  <div class="session-mode" role="radiogroup" aria-label="로그인 유지 방식">
    <label class="session-mode-option">
      <input type="radio" name="sessionMode" value="persist" checked>
      <span class="option-body">
        <span class="option-title">로그인 상태 유지</span>
        <span class="option-desc">이 브라우저에서 30일 동안 자동 로그인</span>
      </span>
    </label>
    <label class="session-mode-option">
      <input type="radio" name="sessionMode" value="once">
      <span class="option-body">
        <span class="option-title">1회성 로그인 (공공 PC)</span>
        <span class="option-desc">탭을 닫으면 즉시 로그아웃</span>
      </span>
    </label>
  </div>
  <div id="googleBtnSlot"></div>
  <div class="msg" id="gateMsg"></div>
</div>

<div class="card hidden" id="loggedInCard">
  <div class="session-row">
    <div class="who">
      <span class="name" id="sessionName"></span>
      <span class="email" id="sessionEmail"></span>
    </div>
    <button class="logout-link" id="logoutBtn">로그아웃</button>
  </div>

  <div class="launch-list">
    <a class="launch-btn" href="report.html">
      <span class="icon">🚩</span>
      <span class="body">
        <span class="title">제보하기</span>
        <span class="desc">실시간 접속 중인 참여자의 송출 상태를 제보합니다</span>
      </span>
    </a>
    <a class="launch-btn" href="status.html">
      <span class="icon">📋</span>
      <span class="body">
        <span class="title">내 상태</span>
        <span class="desc">이번 주 벌금 현황과 산출 근거를 확인합니다</span>
      </span>
    </a>
  </div>
</div>

<script src="shared/auth.js"></script>
<script src="shared/nav.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(() => {
  const GOOGLE_CLIENT_ID = '280658144716-4vvnjn23skcshm9t65fibnt0dcuvs3va.apps.googleusercontent.com';

  const gateCard = document.getElementById('gateCard');
  const loggedInCard = document.getElementById('loggedInCard');
  const googleBtnSlot = document.getElementById('googleBtnSlot');
  const gateMsg = document.getElementById('gateMsg');

  function showLoggedIn(session) {
    gateCard.classList.add('hidden');
    loggedInCard.classList.remove('hidden');
    Auth.bindSessionUI(session);
  }

  function showGate() {
    gateCard.classList.remove('hidden');
    loggedInCard.classList.add('hidden');
  }

  async function handleCredentialResponse(response) {
    Auth.setMsg(gateMsg, '확인 중...', '');
    try {
      const res = await fetch(Auth.WORKER_BASE + '/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential }),
      });
      const data = await res.json();
      if (!res.ok) {
        Auth.setMsg(gateMsg, data.error || '로그인에 실패했습니다.', 'error');
        return;
      }
      const mode = (document.querySelector('input[name="sessionMode"]:checked') || {}).value;
      Auth.saveSession(data, mode);
      Auth.setMsg(gateMsg, '', '');
      showLoggedIn(data);
      window.location.reload(); // nav를 새 로그인 상태로 다시 렌더링
    } catch (err) {
      Auth.setMsg(gateMsg, '네트워크 오류: ' + err.message, 'error');
    }
  }

  window.addEventListener('load', () => {
    const existing = Auth.getSession();
    if (existing) {
      showLoggedIn(existing);
      return;
    }
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
      });
      google.accounts.id.renderButton(googleBtnSlot, {
        type: 'standard',
        theme: 'outline',
        size: 'large',
        text: 'signin_with',
        shape: 'pill',
      });
    } else {
      Auth.setMsg(gateMsg, 'Google 로그인 스크립트를 불러오지 못했습니다. 새로고침해보세요.', 'error');
    }
  });
})();
</script>
</body>
</html>
