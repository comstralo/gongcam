<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>공부합시당 캠스터디</title>
<style>
  :root {
    --bg: #eef0ec;
    --surface: #ffffff;
    --stage-frame: #1b1d19;
    --ink: #1b1d19;
    --ink-soft: #5c6058;
    --hairline: #d3d6cd;
    --accent: #c8781f;
    --accent-ink: #2a1600;
    --danger: #b3341f;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", "Roboto Mono", Menlo, Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Pretendard", "Segoe UI", Roboto, sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121310;
      --surface: #1a1c17;
      --stage-frame: #0c0d0a;
      --ink: #eef0ea;
      --ink-soft: #9a9d92;
      --hairline: #33362e;
      --accent: #e0a24a;
      --accent-ink: #201200;
      --danger: #e0685a;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121310;
    --surface: #1a1c17;
    --stage-frame: #0c0d0a;
    --ink: #eef0ea;
    --ink-soft: #9a9d92;
    --hairline: #33362e;
    --accent: #e0a24a;
    --accent-ink: #201200;
    --danger: #e0685a;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 16px 32px;
    gap: 18px;
  }

  .sitenav {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 10px;
  }
  .sitenav a {
    flex: 1 1 0;
    text-align: center;
    padding: 9px 12px;
    border-radius: 7px;
    font-size: 13px;
    font-weight: 600;
    text-decoration: none;
    color: var(--ink-soft);
    transition: background 0.15s, color 0.15s;
  }
  .sitenav a.active {
    background: var(--accent);
    color: var(--accent-ink);
  }

  header {
    width: 100%;
    max-width: 480px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
  }
  .brand {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .brand .eyebrow {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .card {
    width: 100%;
    max-width: 480px;
    background: var(--surface);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .gate-copy {
    font-size: 14px;
    line-height: 1.6;
    color: var(--ink-soft);
  }
  .gate-copy strong { color: var(--ink); }

  .session-mode {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .session-mode-option {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 11px 12px;
    border-radius: 8px;
    border: 1px solid var(--hairline);
    background: var(--bg);
    cursor: pointer;
  }
  .session-mode-option:has(input:checked) {
    border-color: var(--accent);
  }
  .session-mode-option input {
    margin-top: 3px;
    accent-color: var(--accent);
    flex-shrink: 0;
  }
  .session-mode-option .option-body {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .session-mode-option .option-title {
    font-size: 13px;
    font-weight: 600;
  }
  .session-mode-option .option-desc {
    font-size: 11px;
    color: var(--ink-soft);
  }

  #googleBtnSlot {
    display: flex;
    justify-content: center;
    min-height: 44px;
  }

  .session-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 10px 14px;
    background: var(--bg);
    border: 1px solid var(--hairline);
    border-radius: 8px;
    font-size: 13px;
  }
  .session-row .who {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }
  .session-row .who .name {
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .session-row .who .email {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-soft);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .logout-link {
    font-size: 12px;
    color: var(--ink-soft);
    text-decoration: underline;
    cursor: pointer;
    background: none;
    border: none;
    padding: 4px;
    flex-shrink: 0;
  }

  .msg {
    font-family: var(--mono);
    font-size: 12px;
    min-height: 16px;
    text-align: center;
  }
  .msg.error { color: var(--danger); }
  .msg.ok { color: var(--accent); }

  .launch-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .launch-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 16px;
    border-radius: 10px;
    border: 1px solid var(--hairline);
    background: var(--bg);
    color: var(--ink);
    text-decoration: none;
    transition: border-color 0.15s, transform 0.1s;
  }
  .launch-btn:active { transform: scale(0.98); }
  .launch-btn .icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--hairline);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .launch-btn .body {
    display: flex;
    flex-direction: column;
    gap: 2px;
    flex: 1;
    min-width: 0;
  }
  .launch-btn .title {
    font-weight: 700;
    font-size: 15px;
  }
  .launch-btn .desc {
    font-size: 12px;
    color: var(--ink-soft);
  }
  .launch-btn .chip {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .launch-btn.always-open {
    border-color: var(--accent);
  }
  .launch-btn.always-open .chip {
    color: var(--accent);
  }
  .launch-btn.locked {
    opacity: 0.55;
    pointer-events: none;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<nav class="sitenav">
  <a href="index.html" class="active">홈</a>
  <a href="checker.html">프레임 체커</a>
  <a href="report.html" class="auth-only hidden">제보하기</a>
  <a href="status.html" class="auth-only hidden">내 상태</a>
</nav>

<header>
  <div class="brand">
    <span class="eyebrow">Framing Check</span>
    <h1>공부합시당 캠스터디</h1>
  </div>
</header>

<div class="card">
  <a class="launch-btn always-open" href="checker.html">
    <span class="icon">📐</span>
    <span class="body">
      <span class="title">프레임 체커</span>
      <span class="desc">4×4 격자로 화각을 점검하고 사진/영상을 촬영합니다</span>
    </span>
    <span class="chip">누구나</span>
  </a>
</div>

<div class="card" id="gateCard">
  <p class="gate-copy">
    아래 기능은 <strong>참여자 명단(스프레드시트 열람 권한)</strong>에 등록된 계정만 이용할 수 있습니다.<br>
    Google 계정으로 로그인하면 자동으로 확인됩니다.
  </p>
  <div class="session-mode" role="radiogroup" aria-label="로그인 유지 방식">
    <label class="session-mode-option">
      <input type="radio" name="sessionMode" value="persist" checked>
      <span class="option-body">
        <span class="option-title">로그인 상태 유지</span>
        <span class="option-desc">이 브라우저에서 30일 동안 자동 로그인</span>
      </span>
    </label>
    <label class="session-mode-option">
      <input type="radio" name="sessionMode" value="once">
      <span class="option-body">
        <span class="option-title">1회성 로그인 (공공 PC)</span>
        <span class="option-desc">탭을 닫으면 즉시 로그아웃</span>
      </span>
    </label>
  </div>
  <div id="googleBtnSlot"></div>
  <div class="msg" id="gateMsg"></div>
</div>

<div class="card hidden" id="loggedInCard">
  <div class="session-row">
    <div class="who">
      <span class="name" id="sessionName"></span>
      <span class="email" id="sessionEmail"></span>
    </div>
    <button class="logout-link" id="logoutBtn">로그아웃</button>
  </div>

  <div class="launch-list">
    <a class="launch-btn" href="report.html">
      <span class="icon">🚩</span>
      <span class="body">
        <span class="title">제보하기</span>
        <span class="desc">실시간 접속 중인 참여자의 송출 상태를 제보합니다</span>
      </span>
    </a>
    <a class="launch-btn" href="status.html">
      <span class="icon">📋</span>
      <span class="body">
        <span class="title">내 상태</span>
        <span class="desc">이번 주 벌금 현황과 산출 근거를 확인합니다</span>
      </span>
    </a>
  </div>
</div>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
(() => {
  const WORKER_BASE = 'https://frame-checker-worker.comstralo.workers.dev';
  const GOOGLE_CLIENT_ID = '280658144716-4vvnjn23skcshm9t65fibnt0dcuvs3va.apps.googleusercontent.com';
  const SESSION_KEY = 'frameCheckerSession';

  const gateCard = document.getElementById('gateCard');
  const loggedInCard = document.getElementById('loggedInCard');
  const googleBtnSlot = document.getElementById('googleBtnSlot');
  const gateMsg = document.getElementById('gateMsg');
  const sessionName = document.getElementById('sessionName');
  const sessionEmail = document.getElementById('sessionEmail');
  const logoutBtn = document.getElementById('logoutBtn');

  function setMsg(el, text, type) {
    el.textContent = text || '';
    el.className = 'msg' + (type ? ' ' + type : '');
  }

  function getSession() {
    try {
      const raw = sessionStorage.getItem(SESSION_KEY) || localStorage.getItem(SESSION_KEY);
      if (!raw) return null;
      const parsed = JSON.parse(raw);
      if (!parsed.token || !parsed.email) return null;
      return parsed;
    } catch {
      return null;
    }
  }

  function saveSession(session, mode) {
    const serialized = JSON.stringify(session);
    if (mode === 'once') {
      sessionStorage.setItem(SESSION_KEY, serialized);
      localStorage.removeItem(SESSION_KEY);
    } else {
      localStorage.setItem(SESSION_KEY, serialized);
      sessionStorage.removeItem(SESSION_KEY);
    }
  }

  function clearSession() {
    localStorage.removeItem(SESSION_KEY);
    sessionStorage.removeItem(SESSION_KEY);
  }

  function showLoggedIn(session) {
    gateCard.classList.add('hidden');
    loggedInCard.classList.remove('hidden');
    sessionName.textContent = session.name || session.email;
    sessionEmail.textContent = session.email;
    document.querySelectorAll('.auth-only').forEach((el) => el.classList.remove('hidden'));
  }

  function showGate() {
    gateCard.classList.remove('hidden');
    loggedInCard.classList.add('hidden');
    document.querySelectorAll('.auth-only').forEach((el) => el.classList.add('hidden'));
  }

  async function handleCredentialResponse(response) {
    setMsg(gateMsg, '확인 중...', '');
    try {
      const res = await fetch(WORKER_BASE + '/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ credential: response.credential }),
      });
      const data = await res.json();
      if (!res.ok) {
        setMsg(gateMsg, data.error || '로그인에 실패했습니다.', 'error');
        return;
      }
      const mode = (document.querySelector('input[name="sessionMode"]:checked') || {}).value;
      saveSession(data, mode);
      setMsg(gateMsg, '', '');
      showLoggedIn(data);
    } catch (err) {
      setMsg(gateMsg, '네트워크 오류: ' + err.message, 'error');
    }
  }

  window.addEventListener('load', () => {
    const existing = getSession();
    if (existing) {
      showLoggedIn(existing);
      return;
    }
    if (window.google && google.accounts && google.accounts.id) {
      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
      });
      google.accounts.id.renderButton(googleBtnSlot, {
        type: 'standard',
        theme: 'outline',
        size: 'large',
        text: 'signin_with',
        shape: 'pill',
      });
    } else {
      setMsg(gateMsg, 'Google 로그인 스크립트를 불러오지 못했습니다. 새로고침해보세요.', 'error');
    }
  });

  logoutBtn.addEventListener('click', () => {
    clearSession();
    showGate();
    window.location.reload();
  });
})();
</script>
</body>
</html>
