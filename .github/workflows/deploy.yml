name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ["app/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  # 🔧 [2026-09-22 사용자 지시: "배포와 E2E 검증을 분리하는 방향으로
  # 진행해줘"] — e2e job이 여기 있으면 실행 시간(간헐적 원인 불명 문제로
  # --workers=1까지 적용해 4~12분)이 그대로 "배포가 끝났는지" 확인하는
  # 데 걸리는 시간이 되어버린다. 배포 자체(build+deploy)는 항상
  # 1~2분이면 끝나고 사이트는 이미 새 버전으로 바뀌어 있는데, 그 뒤에
  # 물린 e2e가 느리거나(순차 실행) 간헐적으로 실패하면 이 워크플로우
  # 전체가 "실패"로 표시돼 실제로는 이미 끝난 배포를 기다리는 것처럼
  # 보였다. e2e를 별도 워크플로우(e2e.yml)로 완전히 분리해, 이
  # 워크플로우는 배포 성공 여부만 정직하게 반영하고 e2e 결과와는
  # 무관해지도록 한다 — e2e.yml이 workflow_run으로 이 워크플로우의
  # 완료를 감지해 이어서 돈다(별도 job이라 여기 실행 시간에 전혀 영향
  # 없음).
