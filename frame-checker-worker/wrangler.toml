name = "frame-checker-worker"
# 🔧 [wrangler dev 로컬 실행 우회, 2026-09-17] main을 src/index.js가 아니라
# src/worker-entry.js(default export만 재노출하는 얇은 래퍼)로 지정한다 —
# 이 환경의 wrangler dev/workerd는 main 모듈이 named export를 하나라도
# 가지면 기동에 실패하는 버그가 있는데, index.js는 다른 도메인 파일들이
# 공유하는 유틸을 100개 이상 export해서 그 버그를 트리거한다. 실제 로직은
# index.js에 그대로 있고, worker-entry.js는 순수 재노출만 한다 — deploy도
# 같은 default export만 보므로 동작에 차이가 없다(src/worker-entry.js 주석
# 참고).
main = "src/worker-entry.js"
compatibility_date = "2024-11-01"

[[kv_namespaces]]
binding = "REPORTS_KV"
id = "4c09599c0cf34fb493137a337b0cf1db"

[[kv_namespaces]]
binding = "PUSH_SUBS_KV"
id = "2154564b9fb44d15ae0d682a7ce86232"

[[durable_objects.bindings]]
name = "PARTICIPANTS_DO"
class_name = "ParticipantsRoster"

[[durable_objects.bindings]]
name = "USAGE_STATS_DO"
class_name = "UsageStats"

[[durable_objects.bindings]]
name = "REPORT_QUEUE_DO"
class_name = "ReportQueue"

[[durable_objects.bindings]]
name = "LEAVE_QUEUE_DO"
class_name = "LeaveQueue"

[[durable_objects.bindings]]
name = "REPORT_VOTE_DO"
class_name = "ReportVote"

[[durable_objects.bindings]]
name = "MEMBER_SETTINGS_DO"
class_name = "MemberSettingsDO"

[[durable_objects.bindings]]
name = "PUSH_SUBSCRIPTIONS_DO"
class_name = "PushSubscriptionsDO"

[[durable_objects.bindings]]
name = "BOT_ADMIN_CONFIG_DO"
class_name = "BotAdminConfigDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["ParticipantsRoster"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["UsageStats"]

[[migrations]]
tag = "v3"
new_sqlite_classes = ["ReportQueue"]

[[migrations]]
tag = "v4"
new_sqlite_classes = ["LeaveQueue", "ReportVote"]

[[migrations]]
tag = "v5"
new_sqlite_classes = ["MemberSettingsDO", "PushSubscriptionsDO", "BotAdminConfigDO"]

# 90분 자동 위반인정(TARGET_RESPONSE_TIMEOUT_MS, index.js)이 관리자/대상자가
# 화면을 열어야만 지연 평가되던 것을 보완 — 5분마다 만료된 항목을 스스로
# 찾아 처리한다(사용자 결정). 90분 기준에 비해 5분은 충분히 촘촘하다.
[triggers]
crons = ["*/5 * * * *"]

[vars]
ALLOWED_ORIGIN = "https://comstralo.github.io"
# 앱스크립트(sheet_reset)가 매주 초기화 직전 시트 전체를 복사해 저장하는 Drive 폴더.
# 이 폴더는 일반 사용자와 공유되어 있지 않고 서비스 계정에게만 뷰어 권한이 부여됨.
BACKUP_FOLDER_ID = "15-_j0UmDC3Ox6l1ujZmAeGuuLU3gHhH7"
